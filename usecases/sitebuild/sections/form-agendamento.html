<section id="agendar" class="bg-surface font-sans text-ink">
  <div class="mx-auto max-w-2xl px-6 py-20 md:py-24">
    <h2 class="font-display text-4xl font-semibold text-balance">Agende seu horário</h2>
    <p class="mt-3 text-lg leading-relaxed text-muted">Diga o melhor dia e período e confirmamos pelo WhatsApp.</p>
    <form data-vz-form="agendamento" class="mt-10 grid gap-4 md:grid-cols-2">
      <label class="grid gap-1.5 text-sm font-medium md:col-span-2">
        Nome
        <input type="text" name="lead.name" required autocomplete="name" placeholder="Como podemos te chamar?" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
      </label>
      <label class="grid gap-1.5 text-sm font-medium md:col-span-2">
        WhatsApp
        <input type="tel" name="lead.phone" required autocomplete="tel" placeholder="(11) 90000-0000" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
      </label>
      <label class="grid gap-1.5 text-sm font-medium md:col-span-2">
        E-mail
        <input type="email" name="lead.email" autocomplete="email" placeholder="voce@email.com" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
      </label>
      <label class="grid gap-1.5 text-sm font-medium">
        Dia preferido
        <input type="date" name="field.dia_preferido" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
      </label>
      <label class="grid gap-1.5 text-sm font-medium">
        Período
        <select name="field.periodo" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
          <option value="manha">Manhã</option>
          <option value="tarde">Tarde</option>
          <option value="noite">Noite</option>
        </select>
      </label>
      <label class="flex items-start gap-3 text-sm leading-relaxed text-muted md:col-span-2">
        <input type="checkbox" name="consent" required class="mt-1 size-4 accent-brand">
        Autorizo o contato por WhatsApp, telefone ou e-mail e concordo com a <a href="/privacidade" class="font-medium text-brand underline">Política de Privacidade</a>.
      </label>
      <button type="submit" class="mt-2 rounded-xl bg-brand px-6 py-4 text-base font-semibold text-brand-ink transition hover:brightness-110 md:col-span-2">Pedir horário</button>
    </form>
  </div>
</section>
