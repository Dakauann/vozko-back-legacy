<section id="contato" class="bg-surface font-sans text-ink">
  <div class="mx-auto max-w-2xl px-6 py-20 md:py-24">
    <h2 class="font-display text-4xl font-semibold text-balance">Fale com a gente</h2>
    <p class="mt-3 text-lg leading-relaxed text-muted">Mande sua mensagem e respondemos pelo WhatsApp ou por e-mail.</p>
    <form data-vz-form="contato" class="mt-10 grid gap-4">
      <label class="grid gap-1.5 text-sm font-medium">
        Nome
        <input type="text" name="lead.name" required autocomplete="name" placeholder="Como podemos te chamar?" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
      </label>
      <label class="grid gap-1.5 text-sm font-medium">
        WhatsApp
        <input type="tel" name="lead.phone" required autocomplete="tel" placeholder="(11) 90000-0000" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
      </label>
      <label class="grid gap-1.5 text-sm font-medium">
        E-mail
        <input type="email" name="lead.email" autocomplete="email" placeholder="voce@email.com" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15">
      </label>
      <label class="grid gap-1.5 text-sm font-medium">
        Mensagem
        <textarea name="field.mensagem" rows="4" placeholder="Conte como podemos ajudar" class="rounded-xl border border-line bg-white px-4 py-3 text-base outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15"></textarea>
      </label>
      <label class="flex items-start gap-3 text-sm leading-relaxed text-muted">
        <input type="checkbox" name="consent" required class="mt-1 size-4 accent-brand">
        Autorizo o contato por WhatsApp, telefone ou e-mail e concordo com a <a href="/privacidade" class="font-medium text-brand underline">Política de Privacidade</a>.
      </label>
      <button type="submit" class="mt-2 rounded-xl bg-brand px-6 py-4 text-base font-semibold text-brand-ink transition hover:brightness-110">Enviar mensagem</button>
    </form>
  </div>
</section>
